# Passerelle de la recette locale (rôle de Kong dans Supabase).
#   8000 : HTTP, publié sur 127.0.0.1 pour le navigateur
#   8443 : HTTPS, interne au réseau Docker, pour l'API (SUPABASE_URL=https://gateway:8443)

server {
    listen 8000;
    listen 8443 ssl;
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    client_max_body_size 64m;

    # Un seul jeu d'en-têtes CORS : un doublon est refusé par les navigateurs
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    add_header Access-Control-Allow-Origin   "http://localhost:5173" always;
    add_header Access-Control-Allow-Methods  "GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD" always;
    add_header Access-Control-Allow-Headers  "authorization,apikey,content-type,x-client-info,x-upsert,prefer,accept-profile,content-profile,x-supabase-api-version,cache-control" always;
    add_header Access-Control-Expose-Headers "content-range,content-disposition" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /auth/v1/    { proxy_pass http://auth:9999/; }
    location /rest/v1/    { proxy_pass http://rest:3000/; }
    location /storage/v1/ { proxy_pass http://storage:5000/; }
    location /            { return 404; }
}
