# docker-compose.yml — API, compilation LaTeX isolée et frontend, démarrage local ou sur la VM Oracle
#
#   docker compose up -d --build             API + latex-runner + frontend (MongoDB externe, Atlas par exemple)
#   docker compose --profile dev up -d       ajoute MongoDB local et son interface
#
# Secrets : uniquement dans .env.docker (non versionné, modèle : .env.docker.example) ;
# tests locaux : .env.docker.test, avec API_ENV_FILE et --env-file .env.docker.test.
# Tous les ports sont liés à 127.0.0.1 : sur la VM, nginx sert de frontal.
# latex-runner et cv-extractor n'ont ni secret ni port publié : chacun sur son réseau interne, partagé avec l'API seule.

services:

  # ── Backend Node.js ────────────────────────────────────────
  api:
    build:
      context: ./blog-api
      dockerfile: Dockerfile
    container_name: blog-api
    restart: unless-stopped
    # Secrets de l'API (non versionnés). API_ENV_FILE permet un fichier de test local
    # (.env.docker.test) sans toucher à celui de la VM.
    env_file: ${API_ENV_FILE:-.env.docker}
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Aperçu PDF de l'éditeur LaTeX, délégué au service isolé ci-dessous (doc 22).
      # Sans cette variable, POST /api/cv/compile répond 503 et l'éditeur propose le .tex.
      - LATEX_RUNNER_URL=http://latex-runner:3000
      # Import de CV du studio : extraction du texte par le service isolé cv-extractor (doc 23).
      # Sans cette variable, POST /api/cv/import répond 503.
      - CV_EXTRACTOR_URL=http://cv-extractor:3100
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - uploads_data:/app/public/uploads
      # Certificat Supabase (public, non secret) pour AI_DATABASE_CA_FILE=/run/certs/supabase-ca.crt :
      # - /etc/blog-api/supabase-ca.crt:/run/certs/supabase-ca.crt:ro
    networks:
      - blog-network
      - latex-net
      - extract-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mongo:
        condition: service_healthy
        required: false
      latex-runner:
        condition: service_healthy
        required: false
      cv-extractor:
        condition: service_healthy
        required: false

  # ── Compilation LaTeX isolée (aperçu PDF de l'éditeur) ─────
  # Reçoit uniquement { tex, photo } de l'API ; aucun secret, aucun fichier d'environnement,
  # aucun port publié. Réseau interne sans sortie : ni Internet, ni hôte, seule l'API le joint.
  # TeX tourne sans shell-escape, lecture et écriture limitées au dossier de travail (doc 22).
  latex-runner:
    build:
      context: ./latex-runner
      dockerfile: Dockerfile
    container_name: latex-runner
    restart: unless-stopped
    environment:
      - LATEX_MAX_CONCURRENCY=2
      - LATEX_TIMEOUT_MS=20000
    user: "10001:10001"
    read_only: true
    tmpfs:
      # Espace de travail jetable : un dossier par compilation, supprimé aussitôt ; rien n'y est exécutable
      - /work:rw,size=64m,mode=0700,uid=10001,gid=10001,noexec,nosuid,nodev
      - /tmp:rw,size=1m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Processus d'initialisation : récupère tout processus TeX orphelin
    init: true
    pids_limit: 64
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 256
        hard: 256
      core: 0
    networks:
      - latex-net
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

  # ── Extraction isolée des CV importés (studio LaTeX) ───────
  # Reçoit uniquement les octets du fichier et son format ; aucun secret, aucun port publié.
  # Réseau interne distinct : ni Internet, ni hôte, ni latex-runner, seule l'API le joint.
  # Le fichier n'est jamais écrit : extraction en mémoire, dans un thread borné (doc 23).
  cv-extractor:
    build:
      context: ./cv-extractor
      dockerfile: Dockerfile
    container_name: cv-extractor
    restart: unless-stopped
    environment:
      - EXTRACT_MAX_CONCURRENCY=2
      - EXTRACT_TIMEOUT_MS=20000
    user: "10002:10002"
    read_only: true
    tmpfs:
      - /tmp:rw,size=1m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 64
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 256
        hard: 256
      core: 0
    networks:
      - extract-net
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

  # ── Frontend React (Nginx) ────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        # Aucune clé privée en argument de build : les clés IA restent dans Supabase Vault
    container_name: blog-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    networks:
      - blog-network
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── MongoDB local (profil dev) ─────────────────────────────
  mongo:
    image: mongo:7-jammy
    container_name: blog-mongo
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-}
      MONGO_INITDB_DATABASE: blog
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - blog-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Mongo Express — interface web (profil dev) ─────────────
  mongo-express:
    image: mongo-express:1-20-alpine3.19
    container_name: blog-mongo-ui
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-}@mongo:27017/
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_UI_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_UI_PASSWORD:-}
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - blog-network
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  uploads_data:

networks:
  blog-network:
    driver: bridge
  # Réseau de compilation : interne (aucune route vers Internet ni vers l'hôte), API ↔ latex-runner
  latex-net:
    driver: bridge
    internal: true
  # Réseau d'extraction : interne, API ↔ cv-extractor
  extract-net:
    driver: bridge
    internal: true
